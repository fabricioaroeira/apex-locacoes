<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.supabase.in; frame-src 'self' blob:;">
<title>Apex Locações — Portfólio</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#33322f">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --ink:#2c2c2a; --ink-soft:#5f5e5a; --ink-mute:#8b8a85;
  --line:#e6e3db; --apex:#33322f;
  --good:#15803d; --good-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef3c7;
  --crit:#b91c1c; --crit-soft:#fee2e2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;padding:24px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--apex);border-radius:10px;color:#fff;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:3px solid #8b8a85}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#f7a520,#eb6834);display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;font-family:'Outfit'}
.brand h1{font-family:'Outfit';font-size:15px;font-weight:300;letter-spacing:.2em;text-transform:uppercase}
.brand .sub{font-size:11px;color:rgba(255,255,255,.62);letter-spacing:.05em;margin-top:2px}
.who{font-size:12px;color:rgba(255,255,255,.7);text-align:right;display:flex;align-items:center;gap:12px}
.who b{display:block;color:#fff;font-weight:500}
.who button{background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.9);font:inherit;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer}
.who button:hover{background:rgba(255,255,255,.12)}
h2{font-family:'Outfit';font-weight:300;font-size:22px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-mute);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.ecard:hover{box-shadow:0 6px 20px rgba(0,0,0,.07);transform:translateY(-2px)}
.ecard .top{height:5px;background:var(--c,#8b8a85)}
.ecard .body{padding:15px 16px 16px}
.ecard .tt{display:flex;align-items:flex-start;gap:9px}
.ecard .chip{width:10px;height:10px;border-radius:3px;background:var(--c,#8b8a85);margin-top:5px;flex:none}
.ecard h3{font-size:15px;font-weight:600}
.ecard .tipo{font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.ecard .end{font-size:12px;color:var(--ink-soft);margin-top:8px;min-height:18px}
.ecard dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.ecard dt{font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em}
.ecard dd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.meter{height:6px;background:#eeece6;border-radius:999px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--c,#8b8a85);border-radius:999px}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:5px}
.badges{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.b{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.good{background:var(--good-soft);color:var(--good)}
.b.mute{background:#efede7;color:var(--ink-soft)}
.loading{color:var(--ink-mute);padding:40px;text-align:center}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="mark">A</div>
    <div><h1>Apex Locações</h1><div class="sub">Gestão de portfólio</div></div>
  </div>
  <div class="who">
    <span><b id="user-nome">—</b>Portfólio</span>
    <button id="btn-logout">Sair</button>
  </div>
</header>

<h2>Portfólio</h2>
<div class="kpis" id="kpis"></div>
<div class="grid" id="cards"><div class="loading">Carregando empreendimentos…</div></div>

</div>

<script type="module">
import { requireAuth, getCurrentUser, signOut } from './js/auth.js';
import { listEmpreendimentos, setCtxId } from './js/contexto.js';

const fmtBRL = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const PRESET_LABEL = {
  comercial_rua: 'Comercial de rua',
  galpao_logistico: 'Galpão logístico',
  residencial_multifamiliar: 'Residencial multifamiliar',
  misto: 'Misto',
  avulso: 'Unidade avulsa'
};

async function boot() {
  await requireAuth();
  const user = await getCurrentUser();
  document.getElementById('user-nome').textContent = user?.nome || user?.email || '—';
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(); location.href = './login.html';
  });

  const emps = await listEmpreendimentos(true);

  // Um empreendimento só? Entra direto no app (o portfólio vira relevante
  // quando o segundo imóvel for cadastrado).
  if (emps.length === 1) {
    setCtxId(emps[0].empreendimento_id);
    location.replace('./index.html');
    return;
  }

  // KPIs consolidados
  const receita  = emps.reduce((s, e) => s + Number(e.receita_mes || 0), 0);
  const unid     = emps.reduce((s, e) => s + (e.unidades || 0), 0);
  const ocup     = emps.reduce((s, e) => s + (e.unidades_ocupadas || 0), 0);
  const contr    = emps.reduce((s, e) => s + (e.contratos_ativos || 0), 0);
  const venc90   = emps.reduce((s, e) => s + (e.vencendo_90d || 0), 0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="l">Receita mensal</div><div class="v">${fmtBRL(receita)}</div><div class="s">${emps.length} empreendimentos</div></div>
    <div class="kpi"><div class="l">Unidades</div><div class="v">${unid}</div><div class="s">portfólio inteiro</div></div>
    <div class="kpi"><div class="l">Ocupação global</div><div class="v">${unid ? Math.round(ocup / unid * 100) : 0}%</div><div class="s">${ocup} de ${unid} ocupadas</div></div>
    <div class="kpi"><div class="l">Contratos ativos</div><div class="v">${contr}</div><div class="s">${venc90} vencem em 90 dias</div></div>
    <div class="kpi"><div class="l">Propostas ativas</div><div class="v">${emps.reduce((s, e) => s + (e.propostas_ativas || 0), 0)}</div><div class="s">em análise ou aceitas</div></div>`;

  // Cards
  document.getElementById('cards').innerHTML = emps.map(e => {
    const pct = e.unidades ? Math.round(e.unidades_ocupadas / e.unidades * 100) : 0;
    const temVagas = (e.vagas || 0) > 0;
    return `
    <a class="ecard" style="--c:${e.cor}" href="./index.html?emp=${encodeURIComponent(e.slug)}">
      <div class="top"></div>
      <div class="body">
        <div class="tt"><span class="chip"></span><div>
          <h3>${e.nome}</h3>
          <div class="tipo">${PRESET_LABEL[e.preset] || e.preset}</div>
        </div></div>
        <div class="end">${[e.endereco, e.cidade && e.uf ? e.cidade + '/' + e.uf : e.cidade].filter(Boolean).join(' · ')}</div>
        <dl>
          <dt>Unidades</dt><dt>Receita/mês</dt>
          <dd>${e.unidades}${temVagas ? ` <span style="font-weight:400;font-size:12px;color:var(--ink-mute)">+ ${e.vagas} vagas</span>` : ''}</dd>
          <dd>${fmtBRL(e.receita_mes)}</dd>
        </dl>
        <div class="meter"><i style="width:${pct}%"></i></div>
        <div class="mlab"><span>Ocupação</span><b>${pct}% · ${e.unidades_ocupadas} de ${e.unidades}</b></div>
        <div class="badges">
          ${e.vencendo_90d ? `<span class="b warn">${e.vencendo_90d} vencimento${e.vencendo_90d > 1 ? 's' : ''} em 90d</span>` : '<span class="b good">sem vencimentos próximos</span>'}
          <span class="b mute">${e.inquilinos_ativos} inquilino${e.inquilinos_ativos !== 1 ? 's' : ''}</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

boot().catch(err => {
  console.error(err);
  document.getElementById('cards').innerHTML = `<div class="loading">Erro ao carregar: ${err.message}</div>`;
});
</script>
</body>
</html>
